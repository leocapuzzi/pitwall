<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITWALL · LIGMA Racing</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- filtro do LIQUID GLASS: distorce + desfoca + satura o que passa por baixo
         (usado via backdrop-filter:url(#pw-glass) nos painéis flutuantes) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="pw-glass" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.6" result="softnoise" />
        <feDisplacementMap in="SourceGraphic" in2="softnoise" scale="38" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur in="disp" stdDeviation="9" />
        <feColorMatrix type="saturate" values="1.45" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.12" /><feFuncG type="linear" slope="1.12" /><feFuncB type="linear" slope="1.12" />
        </feComponentTransfer>
      </filter>
    </svg>
    <script src="/porsche-mark.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
